# Lancer tout le projet :   docker compose up --build
# Aucune configuration requise : toutes les valeurs ont un défaut.
# (Pour changer un réglage, copiez .env.example en .env.)
name: fuites-eau

x-django-env: &django-env
  POSTGRES_DB: ${POSTGRES_DB:-fuites_eau}
  POSTGRES_USER: ${POSTGRES_USER:-fuites}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changez-moi}
  POSTGRES_HOST: db            # nom du service, pas localhost
  POSTGRES_PORT: "5432"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-cle-de-demo-a-changer-en-production}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
  # « backend » est nécessaire : le simulateur appelle http://backend:8000
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fuites_eau}
      POSTGRES_USER: ${POSTGRES_USER:-fuites}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changez-moi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Pour accéder à la base depuis votre machine, décommentez (change le port si 5432 est pris) :
    # ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment: *django-env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/noeuds/')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

  simulateur:
    build: ./simulator
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CLE_CARTE: ${CLE_CARTE:-demo-cle-amont-01}
      PYTHONUNBUFFERED: "1"
    command: ["python", "simulateur.py", "--url", "http://backend:8000",
              "--hote-controle", "0.0.0.0", "--intervalle", "${SIM_INTERVALLE:-1}"]
    ports:
      - "127.0.0.1:8001:8001"   # panneau de contrôle, accessible seulement depuis cette machine

volumes:
  pgdata:
  media:
